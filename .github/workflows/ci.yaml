name: Sprawdzanie frontendu

on:
  push:
    branches: [main, introduce-to-ci]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Kontrola plików frontendu
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sprawdzanie HTML
        run: npx --yes html-validate@9 "frontend/**/*.html"

      - name: Sprawdzanie CSS
        run: npx --yes stylelint@16 "frontend/**/*.css"

      - name: Sprawdzanie JavaScript
        run: |
          find frontend -name "*.js" -print0 | while IFS= read -r -d '' file; do
            echo "Sprawdzanie $file"
            node --check "$file"
          done